<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ETA 관리 & 정시성 전략 콘솔</title>
<style>
  :root {
    --page: #0a0f14; --surface-1: #111820; --surface-2: #16202b;
    --text-primary: #f2f5f7; --text-secondary: #a9b6c0; --text-muted: #7a8892;
    --border: rgba(255,255,255,0.08); --grid: #223040;
    --accent: #2ecfd6; --accent-dim: #1a8f94;
    --series-1: #2ecfd6; --series-2: #eda100; --series-3: #4a3aa7; --series-4: #e34948;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e05555;
  }
  :root[data-theme="light"] {
    --page: #f4f6f7; --surface-1: #ffffff; --surface-2: #fbfbfa;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --border: rgba(11,11,11,0.10); --grid: #e1e0d9;
    --accent: #0d8f95; --accent-dim: #0a6f74;
    --series-1: #0d8f95; --series-2: #c98500; --series-3: #4a3aa7; --series-4: #d03b3b;
  }
  * { box-sizing: border-box; max-width: 100%; }
  html, body {
    margin: 0; padding: 0; width: 100%; overflow-x: hidden; overscroll-behavior: none;
    min-height: 100vh; min-height: calc(var(--vh, 1vh) * 100); min-height: 100dvh;
  }
  body {
    background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
  }
  .wrap { max-width: 1240px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 18px; padding: 24px; }
  .crumb { font-size: 12px; color: var(--accent); letter-spacing: .04em; font-weight: 600; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 26px; margin: 6px 0 6px; }
  .sub { font-size: 13px; color: var(--text-secondary); max-width: 640px; line-height: 1.6; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .header-qr { width: 74px; height: 74px; padding: 5px; background: #fff; border-radius: 8px; display: block; }
  .header-qr-label { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 3px; }
  .route-info { text-align: right; font-size: 12px; color: var(--text-secondary); line-height: 1.9; }
  .route-info b { color: var(--text-primary); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab-btn {
    background: none; border: none; color: var(--text-secondary); font-size: 13px; font-family: inherit;
    padding: 12px 18px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn[data-active="true"] { color: var(--text-primary); border-bottom-color: var(--accent); background: var(--surface-1); }
  .tab-panel { display: none; flex-direction: column; gap: 16px; }
  .tab-panel[data-active="true"] { display: flex; }

  .stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
  @media (max-width: 800px) { .stat-row { grid-template-columns: repeat(2,1fr); } }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-tile .value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .card h2 { font-size: 15px; margin: 0 0 4px; }
  .card .desc { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

  .do-list { display: flex; flex-direction: column; }
  .do-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .do-row:last-of-type { border-bottom: none; }
  .do-row .name { color: var(--text-secondary); }
  .do-row .val { font-weight: 600; color: var(--text-primary); }
  .do-foot { font-size: 11px; color: var(--text-muted); margin-top: 10px; }

  svg.chart { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; margin: 10px 0; }
  .bar-row .name { width: 150px; flex: none; color: var(--text-secondary); }
  .bar-track { flex: 1; height: 11px; border-radius: 6px; background: var(--grid); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .bar-row .val { width: 60px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }

  .slider-row { display: flex; align-items: center; gap: 14px; margin: 12px 0; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider-row .val { width: 90px; text-align: right; font-size: 13px; font-weight: 600; color: var(--accent); flex: none; }

  .priority-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .priority-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-secondary); font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .priority-toggle button[data-active="true"] { border-color: var(--accent); color: var(--text-primary); background: var(--surface-1); }
  .recommend-banner {
    margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 12px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text-primary);
  }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
  .table-wrap table { min-width: 480px; }

  .timeline { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .timeline button {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
    border-radius: 8px; padding: 0 12px; height: 32px; cursor: pointer; font-size: 12px; flex: none; font-family: inherit;
  }
  .timeline input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .timeline .val { font-size: 12px; color: var(--text-secondary); width: 100px; text-align: right; flex: none; }
  .chokepoints { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  @media (max-width: 700px) { .chokepoints { grid-template-columns: 1fr; } }
  .chip { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 11px; background: var(--surface-2); }
  .chip .name { font-weight: 600; font-size: 12px; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 999px; margin-top: 4px;
  }
  .status-badge.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .status-badge.warning { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--warning); }
  .status-badge.serious { background: color-mix(in srgb, var(--serious) 22%, transparent); color: var(--serious); }
  .status-badge.critical { background: color-mix(in srgb, var(--critical) 18%, transparent); color: var(--critical); }

  /* ---------- voyage simulation tab ---------- */
  .sim-layout { display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
  .sim-side { display: flex; flex-direction: column; gap: 14px; }
  .dest-toggle { display: flex; gap: 8px; }
  .dest-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text-secondary); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .dest-btn[data-active="true"] { border-color: var(--accent); color: var(--text-primary); background: var(--surface-1); }
  svg.simchart { width: 100%; height: auto; display: block; border-radius: 10px; touch-action: none; }
  .sim-tooltip {
    position: absolute; pointer-events: none; background: #000c; color: #fff; font-size: 11px;
    padding: 4px 8px; border-radius: 6px; transform: translate(-50%, -130%); white-space: nowrap;
    opacity: 0; transition: opacity .1s; z-index: 5;
  }
  .sim-progress-track { flex: 1; min-width: 120px; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; position: relative; }
  .sim-progress-fill { height: 100%; background: #ff8c1a; border-radius: 4px; width: 0%; }
  .sim-progress-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; min-width: 150px; text-align: right; }
  .sim-anim-select { display: flex; gap: 6px; margin-top: 8px; }
  .sim-anim-select button {
    flex: 1; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .sim-anim-select button[data-active="true"] { border-color: #ff8c1a; color: var(--text-primary); }
  .sim-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
  .sim-stat-cell { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .sim-stat-cell .lbl { color: var(--text-muted); font-size: 10px; }
  .sim-stat-cell .val { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .sim-save-banner {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 12px; line-height: 1.5;
    background: color-mix(in srgb, #ff8c1a 16%, transparent); color: var(--text-primary); border: 1px solid color-mix(in srgb, #ff8c1a 40%, transparent);
  }
  .sim-save-banner b { color: #ff8c1a; font-size: 14px; }
  .switch-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); margin: 6px 0; cursor: pointer; user-select: none; }
  .switch-row-label { flex: 1; }
  .switch { display: inline-flex; align-items: center; position: relative; flex: none; }
  .switch input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .switch-track { display: none; }
  .swatch-line { display: inline-block; width: 18px; height: 0; border-top: 3px solid; flex: none; }
  .map-wrap { position: relative; }
  .sim-legend {
    display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; color: var(--text-muted);
    margin-top: 6px; pointer-events: none;
  }
  .sim-legend span { display: inline-flex; align-items: center; white-space: nowrap; }
  .sim-legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; flex: none; }
  /* sim-sheet: plain pass-through container on desktop, becomes a fixed bottom sheet on mobile */
  .sim-sheet, .sim-sheet-body { display: contents; }
  .sim-sheet-handle { display: none; }

  footer { font-size: 11px; color: var(--text-muted); text-align: center; padding: 6px 0; }

  /* ---------- mobile ---------- */
  @media (max-width: 640px) {
    .wrap { padding: 12px; gap: 12px; }
    h1 { font-size: 20px; }
    .sub { font-size: 12px; max-width: none; }
    header { flex-direction: column; gap: 6px; }
    .header-right { align-items: flex-start; flex-direction: row-reverse; justify-content: flex-end; width: 100%; }
    .route-info { text-align: left; line-height: 1.6; }

    .stat-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat-tile { padding: 12px; }
    .stat-tile .value { font-size: 22px; }
    .stat-tile .label { font-size: 11px; }

    .card { padding: 14px; }
    .card h2 { font-size: 14px; }

    .tabs { gap: 0; }
    .tab-btn { padding: 10px 12px; font-size: 12px; }

    .bar-row { flex-wrap: wrap; row-gap: 4px; }
    .bar-row .name { width: 100%; order: 1; }
    .bar-row .bar-track { order: 2; flex: 1 1 auto; }
    .bar-row .val { order: 3; width: auto; margin-left: 8px; }

    .slider-row { flex-wrap: wrap; row-gap: 6px; }
    .slider-row > span:first-child { width: 100%; }
    .slider-row input[type=range] { flex: 1 1 auto; min-width: 0; }
    .slider-row .val { width: auto; margin-left: 8px; }
    .slider-row select, .slider-row input[type=number] { flex: 1 1 auto; min-width: 0; }

    .grid2 { gap: 10px; }

    .table-wrap table { font-size: 11px; }
  }

  /* ---------- mobile app-shell: voyage-sim map screen (map + overlay controls, bottom sheet) ---------- */
  @media (max-width: 768px) {
    :root {
      --mobile-topbar-h: 44px;
      --mobile-desttab-h: 52px;
      --mobile-ctrlbar-h: 88px;
      --mobile-animbar-h: 40px;
      --sheet-handle-h: 52px;
    }

    body.map-active .crumb, body.map-active header, body.map-active footer { display: none; }
    body.map-active .wrap { gap: 0; padding: 0; }

    .tabs {
      position: sticky; top: 0; z-index: 60; background: var(--page);
      padding-top: env(safe-area-inset-top);
    }
    .tab-btn { min-height: 44px; }

    #simMapWrap {
      position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); z-index: 5;
      top: calc(var(--mobile-topbar-h) + var(--mobile-desttab-h) + env(safe-area-inset-top));
      bottom: calc(var(--mobile-ctrlbar-h) + var(--mobile-animbar-h) + var(--sheet-handle-h) + env(safe-area-inset-bottom));
      margin: 0; border-radius: 0; padding: 0; border: none; overflow: hidden;
    }
    #simMapWrap > h2, #simMapWrap > .desc { display: none; }
    #simMapWrap .sim-legend {
      position: absolute; left: 10px; bottom: 10px; z-index: 4; margin: 0;
      background: rgba(0,0,0,0.55); padding: 5px 9px; border-radius: 8px; color: #fff;
      max-width: calc(100% - 20px);
    }
    #simMapWrap svg.simchart { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; touch-action: none; }

    #simDestCard {
      position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); z-index: 25;
      top: calc(var(--mobile-topbar-h) + env(safe-area-inset-top));
      height: var(--mobile-desttab-h); margin: 0; border-radius: 0; padding: 8px 10px;
      border-left: none; border-right: none; border-top: none;
      display: flex; align-items: center;
    }
    #simDestCard h2 { display: none; }
    #simDestCard .dest-toggle { width: 100%; }
    #simDestCard .dest-btn { min-height: 44px; font-size: 15px; }

    #simTimeline {
      position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); z-index: 40;
      min-height: var(--mobile-ctrlbar-h); margin: 0; gap: 6px 8px; flex-wrap: wrap; align-content: center;
      background: var(--surface-1); border-top: 1px solid var(--border);
      padding: 8px 12px;
    }
    #simTimeline button { min-width: 44px; min-height: 44px; font-size: 14px; flex: none; }
    #simTimeline .sim-progress-track { flex: 1 1 auto; min-width: 60px; }
    /* the label text ("Day 0.0 / 22.4일 · 0% · 잔여 22.4일") is too long to share a row with the
       3 buttons + progress track on a narrow phone -- flex-basis:100% forces it onto its own row */
    #simTimeline .sim-progress-label { font-size: 13px; min-width: 0; flex: 1 1 100%; text-align: center; }

    #simAnimSelect {
      position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); z-index: 39;
      bottom: calc(var(--mobile-ctrlbar-h) + env(safe-area-inset-bottom));
      height: var(--mobile-animbar-h); margin: 0; padding: 4px 12px;
      background: var(--surface-2); border-top: 1px solid var(--border);
    }
    #simAnimSelect button { min-height: 32px; font-size: 13px; }

    .sim-tooltip { font-size: 14px; padding: 6px 10px; }

    .sim-sheet, .sim-sheet-body { display: block; }
    .sim-sheet {
      position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); z-index: 45;
      bottom: calc(var(--mobile-ctrlbar-h) + var(--mobile-animbar-h) + env(safe-area-inset-bottom));
      background: var(--surface-1); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.4);
      max-height: var(--sheet-handle-h); overflow: hidden;
      transition: max-height .25s ease;
    }
    .sim-sheet.open { max-height: calc(var(--vh, 1vh) * 65); max-height: 65dvh; }
    .sim-sheet-handle {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      min-height: var(--sheet-handle-h); padding: 0 18px; background: none; border: none;
      color: var(--text-primary); font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .sim-sheet-caret { color: var(--text-muted); transition: transform .25s; font-size: 12px; }
    .sim-sheet.open .sim-sheet-caret { transform: rotate(180deg); }
    .sim-sheet-body {
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      max-height: calc((var(--vh, 1vh) * 65) - var(--sheet-handle-h));
      max-height: calc(65dvh - var(--sheet-handle-h));
      padding: 0 16px calc(16px + env(safe-area-inset-bottom));
    }
    .sim-sheet-card { background: none; border: none; border-radius: 0; padding: 14px 0; border-top: 1px solid var(--border); }
    .sim-sheet-card:first-child { border-top: none; padding-top: 0; }
    .sim-sheet-card h2 { font-size: 15px; }

    .switch-row { font-size: 15px; min-height: 44px; gap: 10px; }
    .switch { width: 48px; height: 28px; }
    .switch input[type=checkbox] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; z-index: 2; }
    .switch-track { display: block; position: absolute; inset: 0; background: var(--grid); border-radius: 999px; transition: background .15s; pointer-events: none; }
    .switch-track::before {
      content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
      background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    .switch input:checked + .switch-track { background: var(--accent); }
    .switch input:checked + .switch-track::before { transform: translateX(20px); }

    .sim-stat-grid { font-size: 14px; }
    .sim-stat-cell .val { font-size: 20px; }
    .sim-stat-cell .lbl { font-size: 12px; }
    .sim-save-banner { font-size: 14px; }
    .sim-save-banner b { font-size: 18px; }
  }
</style>

  // ---------- shared mini line-chart builder (SPC-capable) ----------
  function lineChart({ months, values, cl, ucl, lcl, peakMonth, warnMonth, height = 220, showAxis = true }) {
    const W = 900, H = height, padL = 42, padR = 16, padT = 16, padB = 28;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const yMax = Math.max(ucl, ...values) * 1.08;
    const yMin = Math.min(lcl, ...values) * 0.92;
    const x = i => padL + (i / (values.length - 1)) * innerW;
    const y = v => padT + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
    // gridlines
    for (let g = 0; g <= 4; g++) {
      const gy = padT + (g / 4) * innerH;
      svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="var(--grid)" stroke-width="1"/>`;
    }
    // UCL/LCL band
    svg += `<rect x="${padL}" y="${y(ucl)}" width="${innerW}" height="${y(lcl) - y(ucl)}" fill="var(--accent)" opacity="0.06"/>`;
    svg += `<line x1="${padL}" y1="${y(ucl)}" x2="${W - padR}" y2="${y(ucl)}" stroke="var(--critical)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    svg += `<line x1="${padL}" y1="${y(lcl)}" x2="${W - padR}" y2="${y(lcl)}" stroke="var(--critical)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    svg += `<line x1="${padL}" y1="${y(cl)}" x2="${W - padR}" y2="${y(cl)}" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="2 3"/>`;
    // labels
    svg += `<text x="${W - padR}" y="${y(ucl) - 4}" font-size="10" fill="var(--critical)" text-anchor="end">UCL ${ucl}h</text>`;
    svg += `<text x="${W - padR}" y="${y(lcl) + 12}" font-size="10" fill="var(--critical)" text-anchor="end">LCL ${lcl}h</text>`;
    svg += `<text x="${W - padR}" y="${y(cl) - 4}" font-size="10" fill="var(--text-muted)" text-anchor="end">CL ${cl}h</text>`;
    // line
    const pathD = values.map((v, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    svg += `<path d="${pathD}" fill="none" stroke="var(--series-1)" stroke-width="2.2" stroke-linecap="round"/>`;
    // points, flag peak/warning
    values.forEach((v, i) => {
      const m = months[i];
      let fill = "var(--series-1)", r = 2.6;
      if (m === peakMonth) { fill = "var(--critical)"; r = 4.5; }
      else if (m === warnMonth) { fill = "var(--warning)"; r = 4.5; }
      svg += `<circle cx="${x(i)}" cy="${y(v)}" r="${r}" fill="${fill}"><title>${m}: ${v}h</title></circle>`;
    });
    if (showAxis) {
      const step = Math.ceil(months.length / 9);
      months.forEach((m, i) => {
        if (i % step === 0 || i === months.length - 1) {
          svg += `<text x="${x(i)}" y="${H - 6}" font-size="9" fill="var(--text-muted)" text-anchor="middle">${m.slice(2)}</text>`;
        }
      });
    }
    svg += `</svg>`;
    return svg;
  }

  // ---------- TAB: route map (chokepoint monitor helper) ----------
  function shipChokepointsHTML() {
    const c = D.chokepoints;
    const stormTotal = Object.values(c.storm_recent_14d).reduce((a, b) => a + b, 0);
    const hormuzStatus = { Low: "good", Watch: "warning", Elevated: "serious", High: "critical", Severe: "critical" }[c.hormuz.risk_level] || "warning";
    const panamaStatus = c.panama.avg_transit_wait_hours > 20 ? "critical" : c.panama.avg_transit_wait_hours > 8 ? "warning" : "good";
    const stormStatus = stormTotal > 10 ? "critical" : stormTotal > 4 ? "warning" : "good";
    const LABEL = { good: "양호", warning: "주의", serious: "위험", critical: "심각" };
    return `

    "동해/북태평양": "한반도 동해-북태평양 항로",
    "발보아 (파나마 태평양측 입구)": "파나마 운하 태평양측 관문 도시",
    "파나마 운하": "태평양-대서양 단축로",
    "콜론 (파나마 대서양측 입구)": "파나마 운하 대서양측 관문 도시",
    "카리브해": "중미 카리브해 해역",
    "플로리다 해협": "쿠바-미국 플로리다 사이 해협",
    "서배너 (목적지)": "도착항 · 미국 동남부 항만",
    "드레이크 해협 (케이프 혼)": "남미 최남단, 파나마 우회 시 경유",
  };

  const SIM_DEST_GROUPS = {
    suez: { label: "수에즈 방면", direct: "suez_direct", detour: "suez_detour" },
    panama: { label: "파나마 방면", direct: "panama_direct", detour: "panama_detour" },
  };
  let simActiveDest = "suez";
  let simShowDirect = true, simShowDetour = true;
  let simAnimKey = null;
  let simPlaying = false, simRafId = null, simStartTime = null;
  const SIM_ANIM_DURATION_MS = 30000;
  let simProgressFrac = 0;
  let simLastProj = null;
  let simZoom = { scale: 1, tx: 0, ty: 0 };
  const simActivePointers = new Map();
  let simPanStart = null, simPinchStartDist = null, simPinchStartScale = 1;

  function simClampScale(s) { return Math.min(6, Math.max(1, s)); }

  // keep the panned/zoomed map content covering the visible frame -- without this, a 1-finger
  // drag (or zooming out after panning) can push the whole map off to one side, leaving blank
  // background showing past the map's edge instead of staying within the frame.
  function simClampPan() {
    const W = simLastProj ? simLastProj.W : 900;
    const H = simLastProj ? simLastProj.H : 480;
    const minTx = W * (1 - simZoom.scale), maxTx = 0;
    const minTy = H * (1 - simZoom.scale), maxTy = 0;
    simZoom.tx = Math.min(maxTx, Math.max(minTx, simZoom.tx));
    simZoom.ty = Math.min(maxTy, Math.max(minTy, simZoom.ty));
  }

  function simResetZoom() { simZoom = { scale: 1, tx: 0, ty: 0 }; }

  // zoom so that the viewBox point (svgX, svgY) -- the pinch midpoint / cursor position, already
  // converted from screen px to the map's internal 900x480 units -- stays visually under the
  // fingers/cursor, instead of the zoom always anchoring at the content's local (0,0) origin
  // (which made pinch/scroll-zoom always "zoom into the same fixed corner" regardless of where
  // the user actually touched).
  function simZoomAt(svgX, svgY, newScale) {
    const oldScale = simZoom.scale;
    newScale = simClampScale(newScale);
    const localX = (svgX - simZoom.tx) / oldScale;
    const localY = (svgY - simZoom.ty) / oldScale;
    simZoom.scale = newScale;
    simZoom.tx = svgX - localX * newScale;
    simZoom.ty = svgY - localY * newScale;
    simClampPan();
  }

  let simPointerRafPending = false;

  function simSchedulePointerUpdate() {
    if (simPointerRafPending) return;
    simPointerRafPending = true;
    requestAnimationFrame(() => {
      simPointerRafPending = false;
      simProcessPointerState();
    });
  }

  function simProcessPointerState() {
    if (!simLastProj) return;
    const svg = document.getElementById("simMapSvg");
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    if (simActivePointers.size === 1 && simPanStart) {
      const [pt] = simActivePointers.values();
      const dx = (pt.x - simPanStart.x) / rect.width * simLastProj.W;
      const dy = (pt.y - simPanStart.y) / rect.height * simLastProj.H;
      simZoom.tx = simPanStart.tx + dx;
      simZoom.ty = simPanStart.ty + dy;
      simClampPan();
      simRenderMap();
    } else if (simActivePointers.size === 2 && simPinchStartDist) {
      const pts = Array.from(simActivePointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const midX = (pts[0].x + pts[1].x) / 2, midY = (pts[0].y + pts[1].y) / 2;
      const svgX = (midX - rect.left) / rect.width * simLastProj.W;
      const svgY = (midY - rect.top) / rect.height * simLastProj.H;
      simZoomAt(svgX, svgY, simPinchStartScale * (dist / simPinchStartDist));
      simRenderMap();
    }
  }

  function simWireZoomPan() {
    const svg = document.getElementById("simMapSvg");
    if (!svg || svg.dataset.zoomWired) return;
    svg.dataset.zoomWired = "1";

    svg.addEventListener("pointerdown", (e) => {
      // setPointerCapture can throw on some browsers/pointer types (seen with synthetic and some
      // SVG-targeted pointer events) -- an uncaught throw here would abort the rest of this
      // handler and silently break pinch/pan state setup for the whole gesture
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      simActivePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (simActivePointers.size === 1) {
        simPanStart = { x: e.clientX, y: e.clientY, tx: simZoom.tx, ty: simZoom.ty };
      } else if (simActivePointers.size === 2) {
        const pts = Array.from(simActivePointers.values());
        simPinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        simPinchStartScale = simZoom.scale;
        simPanStart = null;
      }
    });
    svg.addEventListener("pointermove", (e) => {
      if (!simActivePointers.has(e.pointerId)) return;
      simActivePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      // Two-finger pinches deliver a separate pointermove per finger, not one combined event.
      // Recalculating immediately on each one uses a stale position for the *other* finger,
      // producing a skewed midpoint/distance every other event; those small errors compound
      // over a real gesture (many events) into a large directional drift, which is what made
      // zooming always seem to end up pulled toward one fixed spot on the map. Batch both
      // fingers' updates into a single recompute per animation frame instead.
      simSchedulePointerUpdate();
    });
    const endPointer = (e) => {
      simActivePointers.delete(e.pointerId);
      if (simActivePointers.size < 2) simPinchStartDist = null;
      if (simActivePointers.size < 1) simPanStart = null;
    };
    svg.addEventListener("pointerup", endPointer);
    svg.addEventListener("pointercancel", endPointer);
    svg.addEventListener("pointerleave", endPointer);
    svg.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const svgX = (e.clientX - rect.left) / rect.width * simLastProj.W;
      const svgY = (e.clientY - rect.top) / rect.height * simLastProj.H;
      simZoomAt(svgX, svgY, simZoom.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
      simRenderMap();
    }, { passive: false });
  }

  function simUnwrapLon(lon, eastbound) { return (eastbound && lon < 0) ? lon + 360 : lon; }

  // grid-label formatting to match real-map/atlas convention (N/S/E/W instead of signed numbers)
  function simFormatLat(lat) {
    if (lat === 0) return "0°";
    return `${Math.abs(lat)}°${lat > 0 ? "N" : "S"}`;
  }
  function simFormatLon(lon) {
    // the gridline loop runs lon up to 360 (to cover eastbound-unwrapped Pacific-crossing
    // routes) -- normalize back to the standard -180..180 range before labeling, so e.g. a
    // gridline drawn at raw lon=200 (needed for correct Pacific-crossing positioning) reads as
    // the real-world "160°W" it actually is, not the nonsensical "200°"
    let d = ((lon + 180) % 360 + 360) % 360 - 180;
    if (Math.abs(d) < 1e-6) d = 0;
    if (d === 0) return "0°";
    if (Math.abs(d - 180) < 1e-6) return "180°";
    return `${Math.abs(d)}°${d > 0 ? "E" : "W"}`;
  }

  function simHaversineNm(lat1, lon1, lat2, lon2) {
    const R = 3440.065, rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function simCumulativeDist(points) {
    const cum = [0];
    for (let i = 1; i < points.length; i++) {
      cum.push(cum[i - 1] + simHaversineNm(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon));
    }
    return cum;
  }

  function simProjFor(destKey) {
    const g = SIM_DEST_GROUPS[destKey];
    const eastbound = D.routes_sim[g.direct].eastbound;
    const allPts = D.routes_sim[g.direct].points.concat(D.routes_sim[g.detour].points);
    const lons = allPts.map(p => simUnwrapLon(p.lon, eastbound));
    const lats = allPts.map(p => p.lat);
    const pad = 10;
    const lonMin = Math.min(...lons) - pad, lonMax = Math.max(...lons) + pad;
    const latMin = Math.min(...lats) - pad, latMax = Math.max(...lats) + pad;
    const W = 900, H = 480;
    return {
      W, H, lonMin, lonMax, latMin, latMax, eastbound,
      p(lon, lat) {
        const lu = simUnwrapLon(lon, eastbound);
        const x = (lu - lonMin) / (lonMax - lonMin) * W;
        const y = (latMax - lat) / (latMax - latMin) * H;
        return [x, y];
      },
    };
  }

  function simLandPathD(proj) {
    let d = "";
    WORLD_LAND.forEach(ring => {
      const unwrapped = ring.map(([lon, lat]) => [simUnwrapLon(lon, proj.eastbound), lat]);
      const lons = unwrapped.map(p => p[0]);
      if (Math.max(...lons) < proj.lonMin - 5 || Math.min(...lons) > proj.lonMax + 5) return; // whole ring outside view
      // Don't skip the whole ring on a large jump, and don't connect it with a straight line
      // either -- a ring that merely passes near the Prime Meridian (e.g. a small real jump like
      // 0.1 -> -0.28 near France) gets shifted to a false ~360 deg jump after eastbound-unwrapping.
      // Skipping the whole ring drops entire continents (Eurasia/Africa, containing Korea/Busan);
      // connecting it with "L" instead draws a spurious line slashing across the whole map. The
      // correct fix is to just break the path (moveto) at that one point -- SVG fills open
      // subpaths as if closed, so splitting a ring into pieces here is harmless.
      unwrapped.forEach(([lon, lat], i) => {
        const breakHere = i > 0 && Math.abs(unwrapped[i][0] - unwrapped[i - 1][0]) > 100;
        const [x, y] = proj.p(lon, lat);
        d += (i === 0 || breakHere ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
      });
      d += "Z ";
    });
    return d;
  }

  function simPointAtFraction(points, cum, frac) {
    const targetDist = frac * cum[cum.length - 1];
    let i = 1;
    while (i < cum.length && cum[i] < targetDist) i++;
    i = Math.min(i, cum.length - 1);
    const a = points[i - 1], b = points[i];
    const segLen = cum[i] - cum[i - 1];
    const t = segLen > 0 ? (targetDist - cum[i - 1]) / segLen : 0;
    // interpolate longitude the short way around the antimeridian, not a raw straight-line lerp
    // -- on long Pacific-crossing legs (e.g. 175 -> -140), a raw lerp sends the ship backwards
    // through 0 deg longitude (the wrong way around the globe) before "snapping back" onto the
    // real path once past that segment, which is exactly the sudden-deviation-then-return glitch.
    let bLon = b.lon;
    if (bLon - a.lon > 180) bLon -= 360;
    else if (bLon - a.lon < -180) bLon += 360;
    return { lat: a.lat + (b.lat - a.lat) * t, lon: a.lon + (bLon - a.lon) * t, segIndex: i - 1, segT: t };
  }

  function simLabelWidth(text, fontSize) {
    // rough CJK-heavy width estimate (Korean glyphs render close to square) -- good enough for
    // greedy collision avoidance, doesn't need to be pixel-exact
    return text.length * fontSize * 0.95;
  }

  // greedy label placement: try a handful of offset directions around each marker, in priority
  // order, and pick the first one that doesn't overlap an already-placed label's box. Fixes
  // e.g. "부산" and "대한해협" (genuinely ~50km apart) stacking on top of each other and making
  // Busan look misplaced near Japan.
  function simPlaceLabels(candidates) {
    const placed = [];
    return candidates.map(c => {
      const w = simLabelWidth(c.text, c.fontSize);
      const h = c.fontSize * 1.3;
      const tries = [
        [6, c.isMajor ? 4 : 3],           // right (default)
        [6, -(h - 2)],                    // above-right
        [-(w + 6), c.isMajor ? 4 : 3],    // left
        [-(w + 6), -(h - 2)],             // above-left
        [6, h + 4],                       // below-right
        [-(w + 6), h + 4],                // below-left
        [-(w / 2), -(h + 4)],             // straight above, centered
      ];
      let chosen = tries[0];
      for (const [dx, dy] of tries) {
        const lx = c.x + dx, ly = c.y + dy;
        const box = { x1: lx - 2, y1: ly - h, x2: lx + w + 2, y2: ly + 3 };
        const overlaps = placed.some(pb => !(box.x2 < pb.x1 || box.x1 > pb.x2 || box.y2 < pb.y1 || box.y1 > pb.y2));
        if (!overlaps) { chosen = [dx, dy]; break; }
      }
      const lx = c.x + chosen[0], ly = c.y + chosen[1];
      placed.push({ x1: lx - 2, y1: ly - h, x2: lx + w + 2, y2: ly + 3 });
      return Object.assign({}, c, { lx, ly });
    });
  }

  function simRenderMap() {
    const g = SIM_DEST_GROUPS[simActiveDest];
    const proj = simProjFor(simActiveDest);
    const mapEl = document.getElementById("simMapSvg");
    if (!mapEl) return;
    simLastProj = proj;
    mapEl.setAttribute("viewBox", `0 0 ${proj.W} ${proj.H}`);
    const bg = `<rect x="0" y="0" width="${proj.W}" height="${proj.H}" fill="var(--page)" rx="10"/>`;
    let svg = "";

    for (let lon = -180; lon <= 360; lon += 20) {
      if (lon < proj.lonMin || lon > proj.lonMax) continue;
      const [x1] = proj.p(lon, 90);
      svg += `<line x1="${x1}" y1="0" x2="${x1}" y2="${proj.H}" stroke="var(--grid)" stroke-width="1"/>`;
      svg += `<text x="${x1 + 3}" y="${proj.H - 5}" font-size="9" fill="var(--text-muted)">${simFormatLon(lon)}</text>`;
    }
    for (let lat = -60; lat <= 80; lat += 20) {
      if (lat < proj.latMin || lat > proj.latMax) continue;
      const [, y1] = proj.p(0, lat);
      svg += `<line x1="0" y1="${y1}" x2="${proj.W}" y2="${y1}" stroke="var(--grid)" stroke-width="1"/>`;
      svg += `<text x="4" y="${y1 - 3}" font-size="9" fill="var(--text-muted)">${simFormatLat(lat)}</text>`;
    }
    svg += `<path d="${simLandPathD(proj)}" fill="var(--surface-2)" stroke="var(--border)" stroke-width="0.6" fill-rule="evenodd"/>`;

    function routePath(routeKey, visible, dashed, color) {
      if (!visible) return "";
      const r = D.routes_sim[routeKey];
      const cum = simCumulativeDist(r.points);
      const isAnimating = routeKey === simAnimKey;
      const frac = isAnimating ? simProgressFrac : 0;
      const cutIdx = frac > 0 ? simPointAtFraction(r.points, cum, frac).segIndex + 1 : 0;
      let out = "";
      const dAll = r.points.map((p, i) => (i === 0 ? "M" : "L") + proj.p(p.lon, p.lat).map(v => v.toFixed(1)).join(",")).join(" ");
      out += `<path d="${dAll}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="${dashed || ''}" opacity="${isAnimating ? 0.28 : 0.85}"/>`;
      if (isAnimating && frac > 0) {
        const pts = r.points.slice(0, cutIdx + 1).map(p => proj.p(p.lon, p.lat));
        const cur = simPointAtFraction(r.points, cum, frac);
        pts.push(proj.p(cur.lon, cur.lat));
        const dTraveled = pts.map((xy, i) => (i === 0 ? "M" : "L") + xy.map(v => v.toFixed(1)).join(",")).join(" ");
        out += `<path d="${dTraveled}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>`;
      }
      return out;
    }
    svg += routePath(g.detour, simShowDetour, D.routes_sim[g.detour].dash, "#8a94a6");
    svg += routePath(g.direct, simShowDirect, D.routes_sim[g.direct].dash, "#ff8c1a");

    const labelCandidates = [];
    const seenWp = new Set(); // direct & detour routes often share the same named anchor
    // (e.g. both leave from Busan, both approach via Florida Strait) -- draw it once, not twice
    [g.direct, g.detour].forEach((key, gi) => {
      if (gi === 0 && !simShowDirect) return;
      if (gi === 1 && !simShowDetour) return;
      D.routes_sim[key].points.forEach(p => {
        if (!p.name) return;
        const wpKey = p.name + "@" + p.lat.toFixed(1) + "," + p.lon.toFixed(1);
        if (seenWp.has(wpKey)) return;
        seenWp.add(wpKey);
        const [x, y] = proj.p(p.lon, p.lat);
        const isEndpoint = p.name.includes("출발") || p.name.includes("목적지");
        const isCanal = p.name.includes("운하");
        const isMajor = isEndpoint || isCanal;
        const fill = isEndpoint ? "#fff" : isCanal ? "#ff8c1a" : "var(--accent)";
        const shortName = p.name.replace(/ \(.*\)/, "");
        const desc = SIM_WP_DESC[p.name];
        const tooltipText = desc ? `${p.name} — ${desc}` : p.name;
        svg += `<circle cx="${x}" cy="${y}" r="${isMajor ? 4.5 : 3}" fill="${fill}" stroke="#000" stroke-width="0.8" class="sim-wp" data-name="${tooltipText}"/>`;
        const labelFill = isEndpoint ? "#fff" : isCanal ? "#ff8c1a" : "var(--text-secondary)";
        labelCandidates.push({
          x, y, text: shortName, isMajor,
          fontSize: isMajor ? 11 : 9, weight: isMajor ? 700 : 500, fill: labelFill,
        });
      });
    });
    // place major (endpoint/canal) labels first so they win the preferred slot; minor
    // strait/cape labels get nudged into whichever direction is still free
    labelCandidates.sort((a, b) => (b.isMajor ? 1 : 0) - (a.isMajor ? 1 : 0));
    simPlaceLabels(labelCandidates).forEach(l => {
      svg += `<text x="${l.lx}" y="${l.ly}" font-size="${l.fontSize}" font-weight="${l.weight}" fill="${l.fill}" paint-order="stroke" stroke="#0a0f14" stroke-width="3" stroke-linejoin="round">${l.text}</text>`;
    });

    if (simAnimKey) {
      const r = D.routes_sim[simAnimKey];
      const cum = simCumulativeDist(r.points);
      const cur = simPointAtFraction(r.points, cum, simProgressFrac);
      const [sx, sy] = proj.p(cur.lon, cur.lat);
      const a = r.points[cur.segIndex], b = r.points[Math.min(cur.segIndex + 1, r.points.length - 1)];
      const [ax, ay] = proj.p(a.lon, a.lat), [bx, by] = proj.p(b.lon, b.lat);
      const heading = Math.atan2(bx - ax, -(by - ay)) * 180 / Math.PI;
      const color = simAnimKey.includes("direct") ? "#ff8c1a" : "#8a94a6";
      svg += `<g transform="translate(${sx},${sy}) rotate(${heading})">
        <circle r="10" fill="${color}" opacity="0.25"/>
        <path d="M0,-7 L5,6 L0,3 L-5,6 Z" fill="${color}" stroke="#001018" stroke-width="1"/>
      </g>`;
    }

    mapEl.innerHTML = bg + `<g id="simZoomG" transform="translate(${simZoom.tx},${simZoom.ty}) scale(${simZoom.scale})">` + svg + `</g>`;
    const tip = document.getElementById("simTooltip");
    mapEl.querySelectorAll(".sim-wp").forEach(el => {
      el.addEventListener("mouseenter", () => { tip.textContent = el.dataset.name; tip.style.opacity = 1; });
      el.addEventListener("mousemove", (e) => {
        const rect = mapEl.getBoundingClientRect();
        tip.style.left = (e.clientX - rect.left) + "px";
        tip.style.top = (e.clientY - rect.top) + "px";
      });
      el.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
      // tap support (touch devices have no hover): toggle the tooltip on tap
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const rect = mapEl.getBoundingClientRect();
        const showing = tip.style.opacity === "1" && tip.dataset.activeWp === el.dataset.name;
        tip.dataset.activeWp = el.dataset.name;
        tip.textContent = el.dataset.name;
        tip.style.left = (e.clientX - rect.left) + "px";
        tip.style.top = (e.clientY - rect.top) + "px";
        tip.style.opacity = showing ? 0 : 1;
      });
    });
    if (!mapEl.dataset.tapDismissWired) {
      mapEl.dataset.tapDismissWired = "1";
      mapEl.addEventListener("click", (e) => {
        if (!e.target.closest(".sim-wp")) { tip.style.opacity = 0; tip.dataset.activeWp = ""; }
      });
    }
  }

  function simDefaultAnimKey(destKey) {
    const g = SIM_DEST_GROUPS[destKey];
    return g[g.defaultAnim || "direct"];
  }

  function simRenderDestToggle() {
    document.getElementById("simDestToggle").innerHTML = Object.entries(SIM_DEST_GROUPS).map(([k, g]) =>
      `<button class="dest-btn" data-dest="${k}" data-active="${k === simActiveDest}">${g.label}</button>`
    ).join("");
    document.querySelectorAll("#simDestToggle .dest-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        simActiveDest = btn.dataset.dest;
        simAnimKey = simDefaultAnimKey(simActiveDest);
        simProgressFrac = 0; simPlaying = false;
        cancelAnimationFrame(simRafId);
        simResetZoom();
        simRenderAll();
      });
    });
  }

  function simRenderAnimSelect() {
    const g = SIM_DEST_GROUPS[simActiveDest];
    document.getElementById("simAnimSelect").innerHTML = `
      <button data-key="${g.direct}" data-active="${simAnimKey === g.direct}">▶ 단축 루트로 재생</button>
      <button data-key="${g.detour}" data-active="${simAnimKey === g.detour}">▶ 우회 루트로 재생</button>
    `;
    document.querySelectorAll("#simAnimSelect button").forEach(btn => {
      btn.addEventListener("click", () => {
        simAnimKey = btn.dataset.key;
        simProgressFrac = 0; simPlaying = false;
        cancelAnimationFrame(simRafId);
        simUpdateProgressLabel();
        simRenderAnimSelect();
        simRenderMap();
      });
    });
  }

  function simRenderStats() {
    const g = SIM_DEST_GROUPS[simActiveDest];
    const d = D.routes_sim[g.direct], u = D.routes_sim[g.detour];

  function simUpdateProgressLabel() {
    const fill = document.getElementById("simProgressFill");

    const r = D.routes_sim[simAnimKey];

    fill.style.width = (simProgressFrac * 100).toFixed(1) + "%";
    fill.style.background = simAnimKey.includes("direct") ? "#ff8c1a" : "#8a94a6";
    label.textContent = `Day ${dayNow.toFixed(1)} / ${r.eta_days_20kn}일 · ${(simProgressFrac * 100).toFixed(0)}% · 잔여 ${remain.toFixed(1)}일`;
  }

  function simTick(ts) {
    if (simStartTime === null) simStartTime = ts - simProgressFrac * SIM_ANIM_DURATION_MS;
    const elapsed = ts - simStartTime;
    simProgressFrac = Math.min(1, elapsed / SIM_ANIM_DURATION_MS);
    simUpdateProgressLabel();
    simRenderMap();
    if (simProgressFrac < 1 && simPlaying) {
      simRafId = requestAnimationFrame(simTick);
    } else if (simProgressFrac >= 1) {
      simPlaying = false;
      const btn = document.getElementById("simPlayBtn");

  }

  // ---------- shared: inverse normal CDF (Acklam's rational approximation) ----------
  function probit(p) {
    const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
    const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
    const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
    const plow = 0.02425, phigh = 1 - plow;
    if (p < plow) {
      const q = Math.sqrt(-2 * Math.log(p));
      return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    } else if (p <= phigh) {
      const q = p - 0.5, r = q * q;
      return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
    } else {
      const q = Math.sqrt(-2 * Math.log(1 - p));
      return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    }
  }
  // mu = b0 + Sum(bi*Xi) + b_route + b_carrier -- same structure for both regional models,
  // just pointed at a different coefficient set.
  function aftMu(inputs, region) {
    const A = region === "north_america" ? D.advanced.aft_north_america : D.advanced.aft_europe;
    let mu = A.intercept;
    for (const f of Object.keys(A.coefs_num)) mu += A.coefs_num[f] * inputs[f];
    mu += A.coefs_route?.[inputs.route] || 0;
    mu += A.coefs_carrier?.[inputs.carrier] || 0;
    return mu;
  }
  function aftQuantile(mu, sigma, p) { return Math.exp(mu + sigma * probit(p)); }
  function lognormalPDF(x, mu, sigma) {
    if (x <= 0) return 0;
    return (1 / (x * sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-((Math.log(x) - mu) ** 2) / (2 * sigma * sigma));
  }

  // ---------- TAB: dynamic buffer simulator ----------
  // North America (Panama) and Europe (Suez+Cape unified) are two SEPARATE AFT fits with
  // structurally different covariates -- Panama has real canal-transit congestion metrics;
  // Suez/Cape don't, but have a real operating history (recent route x carrier delay at three

    delay_avg_30d: "최근 30일 항로·선사 실적 (D30)", delay_avg_60d: "최근 60일 항로·선사 실적 (D60)", delay_avg_90d: "최근 90일 항로·선사 실적 (D90)",
  };

    </div>`;
  }

  function renderBuffer() {
    const allCarriers = [...new Set([...Object.keys(D.advanced.aft_north_america.coefs_carrier), ...Object.keys(D.advanced.aft_europe.coefs_carrier), "C사"])];

    return `
      <div class="grid2">
        <div class="card">

          <div class="desc">북미(파나마)와 유럽(수에즈·희망봉)은 서로 다른 AFT 모델입니다 — 지역을 바꾸면 그 지역에 실제로 학습된 조건만 표시됩니다.</div>
          <div class="slider-row">
            <span style="font-size:12px; color:var(--text-secondary); width:190px;">지역</span>
            <select id="bufRegion" style="flex:1; min-width:0; background:var(--surface-2); color:var(--text-primary); border:1px solid var(--border); border-radius:6px; padding:6px;">

            </select>
          </div>

            <div class="stat-tile"><div class="value" id="bufRequired">-</div><div class="label">목표 정시율 달성을 위해 필요한 버퍼 (고객 약속 ETA = Scheduled ETA + 이 값)</div></div>
          </div>
          <h2 style="margin-top:16px;">확률적 도착 분포</h2>
          <div class="desc">x축: Scheduled ETA 대비 초과시간(h) · 파란 영역이 넓을수록 예측 불확실성이 큼</div>
          <div id="bufDist"></div>
        </div>
      </div>
    `;
  }
  function distChart(mu, sigma, targetPct) {
    const median = Math.exp(mu);
    const xMax = Math.exp(mu + sigma * 2.2);
    const W = 560, H = 200, padL = 10, padR = 10, padT = 10, padB = 24;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const N = 120;
    const pts = [];
    let maxY = 0;
    for (let i = 0; i <= N; i++) {
      const x = (i / N) * xMax;
      const y = lognormalPDF(x, mu, sigma);
      pts.push([x, y]);
      maxY = Math.max(maxY, y);
    }
    const px = x => padL + (x / xMax) * innerW;
    const py = y => padT + innerH - (y / maxY) * innerH;
    const reqBuffer = aftQuantile(mu, sigma, targetPct / 100);
    const areaD = "M" + px(0) + "," + py(0) + " " + pts.map(([x, y]) => `L${px(x).toFixed(1)},${py(y).toFixed(1)}`).join(" ") + ` L${px(xMax).toFixed(1)},${py(0).toFixed(1)} Z`;
    const lineD = "M" + pts.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join(" L");
    const medianX = px(median), reqX = px(reqBuffer);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <path d="${areaD}" fill="var(--series-1)" opacity="0.18"/>
      <path d="${lineD}" fill="none" stroke="var(--series-1)" stroke-width="2"/>
      <line x1="${medianX}" y1="${padT}" x2="${medianX}" y2="${H - padB}" stroke="var(--text-secondary)" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="${medianX}" y="${padT - 1}" font-size="9" fill="var(--text-secondary)" text-anchor="middle">중앙값 ${median.toFixed(1)}h</text>
      <line x1="${reqX}" y1="${padT}" x2="${reqX}" y2="${H - padB}" stroke="var(--critical)" stroke-width="1.2" stroke-dasharray="3 3"/>
      <text x="${reqX}" y="${H - padB + 12}" font-size="9" fill="var(--critical)" text-anchor="middle">${targetPct}% 버퍼 ${reqBuffer.toFixed(1)}h</text>
      <text x="${padL}" y="${H - 4}" font-size="9" fill="var(--text-muted)">0h</text>
      <text x="${W - padR}" y="${H - 4}" font-size="9" fill="var(--text-muted)" text-anchor="end">${xMax.toFixed(0)}h</text>
    </svg>`;
  }
  function wireBuffer() {
    const carrierSel = document.getElementById("bufCarrier");
    if (!carrierSel) return;
    // one persistent featureVals object per region, so switching back and forth doesn't lose
    // what you'd set (each region only ever touches its own keys)
    const featureVals = { ...D.advanced.aft_north_america.feature_defaults, ...D.advanced.aft_europe.feature_defaults };

    function currentModel() {
      return bufState.region === "north_america" ? D.advanced.aft_north_america : D.advanced.aft_europe;
    }
    function update() {
      const A = currentModel();
      const inputs = { carrier: bufState.carrier, route: bufState.region === "europe" ? bufState.route : A.route_label };
      for (const f of Object.keys(A.coefs_num)) inputs[f] = featureVals[f];
      const mu = aftMu(inputs, bufState.region);
      const sigma = A.sigma;
      const median = Math.exp(mu);
      const reqBuffer = aftQuantile(mu, sigma, bufState.targetPct / 100);
      document.getElementById("bufMedian").textContent = median.toFixed(1) + "h";
      document.getElementById("bufRequired").textContent = reqBuffer.toFixed(1) + "h";
      document.getElementById("bufDist").innerHTML = distChart(mu, sigma, bufState.targetPct);
    }
    function renderSlidersForRegion() {
      const A = currentModel();
      document.getElementById("bufRouteRow").style.display = bufState.region === "europe" ? "flex" : "none";
      document.getElementById("bufSliders").innerHTML =
        Object.keys(A.coefs_num).map(f => sliderHTML(f, A.feature_ranges, featureVals)).join("");
      document.querySelectorAll(".featSlider").forEach(s => {
        s.addEventListener("input", () => {
          const f = s.dataset.feat;
          featureVals[f] = Number(s.value);
          document.querySelector(`.featVal[data-feat="${f}"]`).textContent = s.value + FEAT_UNIT[f];
          update();
        });
      });
    }
    document.getElementById("bufRegion").addEventListener("change", (e) => {
      bufState.region = e.target.value;
      renderSlidersForRegion();
      update();
    });
    carrierSel.addEventListener("change", () => { bufState.carrier = carrierSel.value; update(); });
    document.getElementById("bufRoute").addEventListener("change", (e) => { bufState.route = e.target.value; update(); });
    document.getElementById("bufTarget").addEventListener("input", (e) => {
      bufState.targetPct = Number(e.target.value);
      document.getElementById("bufTargetVal").textContent = bufState.targetPct + "%";
      update();
    });
    renderSlidersForRegion();
    update();
  }

  // ---------- generic bar-column chart (for MR chart & histogram) ----------
  function barColumnChart({ labels, values, refLine, refLabel, height = 140, color = "var(--series-1)" }) {
    const W = 900, H = height, padL = 36, padR = 12, padT = 10, padB = 24;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const maxV = Math.max(...values.filter(v => v != null), refLine || 0) * 1.15 || 1;
    const bw = innerW / values.length;
    const y0 = padT + innerH;
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
    if (refLine) {
      const ry = padT + innerH - (refLine / maxV) * innerH;
      svg += `<line x1="${padL}" y1="${ry}" x2="${W - padR}" y2="${ry}" stroke="var(--critical)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      svg += `<text x="${W - padR}" y="${ry - 4}" font-size="10" fill="var(--critical)" text-anchor="end">${refLabel}</text>`;
    }
    values.forEach((v, i) => {
      if (v == null) return;
      const bh = (v / maxV) * innerH;
      const x = padL + i * bw + bw * 0.15;
      svg += `<rect x="${x.toFixed(1)}" y="${(y0 - bh).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${bh.toFixed(1)}" fill="${color}" rx="2"><title>${labels[i]}: ${v}</title></rect>`;
    });
    const step = Math.ceil(labels.length / 9);
    labels.forEach((l, i) => {
      if (i % step === 0 || i === labels.length - 1) {
        svg += `<text x="${padL + i * bw + bw / 2}" y="${H - 6}" font-size="9" fill="var(--text-muted)" text-anchor="middle">${l}</text>`;
      }
    });
    svg += `</svg>`;
    return svg;
  }

  // ---------- EWMA chart (supports progressive reveal for the "live" animation) ----------
  function ewmaChart(e, upTo) {
    const n = upTo == null ? e.months.length : upTo;
    const W = 900, H = 340, padL = 42, padR = 16, padT = 16, padB = 28;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const allY = e.values.concat(e.ewma, e.ucl, e.lcl);
    const yMax = Math.max(...allY) * 1.08, yMin = Math.min(...allY) * 0.9;
    const x = i => padL + (i / (e.months.length - 1)) * innerW;
    const y = v => padT + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
    for (let g = 0; g <= 4; g++) {
      const gy = padT + (g / 4) * innerH;
      svg += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="var(--grid)" stroke-width="1"/>`;
    }
    // baseline band
    const bl0 = x(0), bl1 = x(e.baseline_months.length - 1);
    svg += `<rect x="${bl0}" y="${padT}" width="${bl1 - bl0}" height="${innerH}" fill="var(--text-muted)" opacity="0.08"/>`;
    svg += `<text x="${(bl0 + bl1) / 2}" y="${padT + 12}" font-size="9" fill="var(--text-muted)" text-anchor="middle">기준구간</text>`;

    // raw values (faded, context)
    const rawD = e.values.slice(0, n).map((v, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    svg += `<path d="${rawD}" fill="none" stroke="var(--text-muted)" stroke-width="1.2" opacity="0.5"/>`;

    // dynamic UCL/LCL band
    if (n > 1) {
      const uclD = e.ucl.slice(0, n).map((v, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
      const lclD = e.lcl.slice(0, n).map((v, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
      svg += `<path d="${uclD}" fill="none" stroke="var(--critical)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      svg += `<path d="${lclD}" fill="none" stroke="var(--critical)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      svg += `<text x="${x(n - 1)}" y="${y(e.ucl[n - 1]) - 4}" font-size="9" fill="var(--critical)" text-anchor="end">UCL</text>`;
      svg += `<text x="${x(n - 1)}" y="${y(e.lcl[n - 1]) + 11}" font-size="9" fill="var(--critical)" text-anchor="end">LCL</text>`;
    }
    // EWMA line (the star)
    const ewmaD = e.ewma.slice(0, n).map((v, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    svg += `<path d="${ewmaD}" fill="none" stroke="var(--series-1)" stroke-width="2.4" stroke-linecap="round"/>`;
    for (let i = 0; i < n; i++) {
      const m = e.months[i];
      let fill = "var(--series-1)", r = 2.4;
      if (m === e.peak_month) { fill = "var(--critical)"; r = 5; }
      else if (m === e.signal_month) { fill = "var(--warning)"; r = 5; }
      svg += `<circle cx="${x(i)}" cy="${y(e.ewma[i])}" r="${r}" fill="${fill}"><title>${m}: EWMA ${e.ewma[i]}h (실측 ${e.values[i]}h)</title></circle>`;
    }
    const step = Math.ceil(e.months.length / 9);
    e.months.forEach((m, i) => {
      if (i % step === 0 || i === e.months.length - 1) {
        svg += `<text x="${x(i)}" y="${H - 6}" font-size="9" fill="var(--text-muted)" text-anchor="middle">${m.slice(2)}</text>`;
      }
    });
    svg += `</svg>`;
    return svg;
  }

  function wireSPC() {

          scrub.value = n; setFrame(n);

  // ---------- TAB: route alternative calculator ----------
  const calcState = { costPerHour: 450, capeExtra: 38000, suezRisk: 9000, panamaPremium: 22000, carrier: "ALL" };
  const ROUTE_KO = { "Cape of Good Hope": "희망봉 (Cape)", "Suez Canal": "수에즈 (Suez)", "Panama Canal": "파나마 (Panama)" };
  const EXTRA_COST_KEY = { "Cape of Good Hope": "capeExtra", "Suez Canal": "suezRisk", "Panama Canal": "panamaPremium" };

  function avgDelayFor(route, carrier) {
    if (carrier === "ALL") return D.route_alternatives.find(r => r.route === route).avg_delay_hours;
    const row = D.carrier_route_table.find(r => r.carrier === carrier);
    return row ? row[route] : D.route_alternatives.find(r => r.route === route).avg_delay_hours;
  }

  function routeCalcTable() {
    const rows = D.route_alternatives.map(r => {
      const delay = avgDelayFor(r.route, calcState.carrier);
      const delayCost = delay * calcState.costPerHour;
      const extraCost = calcState[EXTRA_COST_KEY[r.route]];
      const total = delayCost + extraCost;
      return { route: r.route, delay, delayCost, extraCost, total };
    }).sort((a, b) => a.total - b.total);
    const best = rows[0];
    const maxTotal = Math.max(...rows.map(r => r.total));
    const table = `
      <div class="table-wrap"><table style="width:100%; border-collapse:collapse; font-size:12px;">
        <thead><tr>
          <th style="text-align:left; padding:8px; color:var(--text-muted); font-weight:600;">항로</th>
          <th style="text-align:right; padding:8px; color:var(--text-muted); font-weight:600;">평균지연(h)</th>
          <th style="text-align:right; padding:8px; color:var(--text-muted); font-weight:600;">지연비용</th>
          <th style="text-align:right; padding:8px; color:var(--text-muted); font-weight:600;">추가비용</th>
          <th style="text-align:right; padding:8px; color:var(--text-muted); font-weight:600;">기대총비용</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr style="border-top:1px solid var(--border); ${r.route === best.route ? "background:color-mix(in srgb, var(--accent) 10%, transparent);" : ""}">
              <td style="padding:8px; color:var(--text-primary); font-weight:${r.route === best.route ? "700" : "400"};">${ROUTE_KO[r.route]}${r.route === best.route ? " ★" : ""}</td>
              <td style="padding:8px; text-align:right; font-variant-numeric:tabular-nums;">${r.delay.toFixed(1)}</td>
              <td style="padding:8px; text-align:right; font-variant-numeric:tabular-nums;">$${Math.round(r.delayCost).toLocaleString()}</td>
              <td style="padding:8px; text-align:right; font-variant-numeric:tabular-nums;">$${Math.round(r.extraCost).toLocaleString()}</td>
              <td style="padding:8px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent);">$${Math.round(r.total).toLocaleString()}</td>
            </tr>
          `).join("")}
        </tbody>
      </table></div>
    `;
    return { table, best };
  }

  function renderRouteCalc() {
    const carriers = ["ALL", ...D.carrier_breakdown.map(c => c.carrier)];
    const numInput = (key, label) => `
      <div class="slider-row">
        <span style="font-size:12px; color:var(--text-secondary); width:220px;">${label}</span>
        <input type="number" id="calc_${key}" value="${calcState[key]}" style="flex:1; min-width:0; background:var(--surface-2); color:var(--text-primary); border:1px solid var(--border); border-radius:6px; padding:6px 10px;" />
      </div>`;
    return `
      <div class="grid2">
        <div class="card">
          <h2>가정 입력 (항차 1건 기준)</h2>
          <div class="desc">TF 보유 실제 원가 데이터로 교체해 사용하세요. 기본값은 예시치입니다.</div>
          ${numInput("costPerHour", "시간당 지연비용 (재고/위약 비용, USD/h)")}
          ${numInput("capeExtra", "희망봉 우회 추가 연료·용선비 (USD, 수에즈 대비)")}
          ${numInput("suezRisk", "수에즈/호르무즈 리스크 보험 추가비용 (USD)")}
          ${numInput("panamaPremium", "파나마 통항 프리미엄 슬롯 비용 (USD, 선택시)")}
          <div class="slider-row">
            <span style="font-size:12px; color:var(--text-secondary); width:220px;">선사 선택</span>
            <select id="calcCarrier" style="flex:1; min-width:0; background:var(--surface-2); color:var(--text-primary); border:1px solid var(--border); border-radius:6px; padding:6px;">
              ${carriers.map(c => `<option value="${c}" ${c === calcState.carrier ? "selected" : ""}>${c === "ALL" ? "전체 평균" : c}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="card">
          <h2>항로별 기대총비용</h2>
          <div class="desc">기대총비용 = 우회/슬롯비용 + 리스크비용 + (평균지연×시간비용) — 선사를 선택하면 그 선사의 실측 평균지연으로 재계산됩니다</div>
          <div id="calcResult"></div>
          <div class="recommend-banner" id="calcRecommend"></div>
        </div>
      </div>
    `;
  }
  function wireRouteCalc() {
    const carrierSel = document.getElementById("calcCarrier");
    if (!carrierSel) return;
    function update() {
      ["costPerHour", "capeExtra", "suezRisk", "panamaPremium"].forEach(k => {
        const el = document.getElementById(`calc_${k}`);
        calcState[k] = Number(el.value) || 0;
      });
      const { table, best } = routeCalcTable();
      document.getElementById("calcResult").innerHTML = table;
      const carrierLabel = calcState.carrier === "ALL" ? "전체 선사 평균" : calcState.carrier;
      document.getElementById("calcRecommend").innerHTML = `${carrierLabel} 기준 최저비용 추천: <b>${ROUTE_KO[best.route]}</b> (기대총비용 $${Math.round(best.total).toLocaleString()})`;
    }
    carrierSel.addEventListener("change", () => { calcState.carrier = carrierSel.value; update(); });
    ["costPerHour", "capeExtra", "suezRisk", "panamaPremium"].forEach(k => {
      document.getElementById(`calc_${k}`).addEventListener("input", update);
    });
    update();
  }

  // ---------- TAB: carrier benchmark ----------
  function renderCarrier() {
    const cs = D.carrier_breakdown;
    const maxDelay = Math.max(...cs.map(c => c.avg_delay_hours));
    const maxOnTime = Math.max(...cs.map(c => c.on_time_pct));
    const maxMajor = Math.max(...cs.map(c => c.major_delay_rate_pct));
    const bars = (key, max, color, unit) => cs.map((c, i) => {
      const v = c[key];
      const barColor = i === 0 ? "var(--good)" : i === cs.length - 1 ? "var(--critical)" : color;
      return `<div class="bar-row"><div class="name">${c.carrier}</div><div class="bar-track"><div class="bar-fill" style="width:${v / max * 100}%; background:${barColor}"></div></div><div class="val">${v}${unit}</div></div>`;
    }).join("");

    const routes = [...new Set(D.carrier_route_table.flatMap(r => Object.keys(r).filter(k => k !== "carrier")))];
    const allVals = D.carrier_route_table.flatMap(r => routes.map(rt => r[rt]).filter(v => v != null));
    const vmin = Math.min(...allVals), vmax = Math.max(...allVals);
    const heat = v => {
      if (v == null) return "";
      const t = (v - vmin) / (vmax - vmin || 1);
      return `color-mix(in srgb, var(--critical) ${Math.round(t * 55)}%, var(--good) ${Math.round((1 - t) * 20)}%)`;
    };
    const table = `
      <div class="table-wrap"><table style="width:100%; border-collapse:collapse; font-size:12px;">
        <thead><tr>
          <th style="text-align:left; padding:8px; color:var(--text-muted); font-weight:600;">선사</th>
          ${routes.map(r => `<th style="text-align:center; padding:8px; color:var(--text-muted); font-weight:600;">${r}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${D.carrier_route_table.map(row => `
            <tr style="border-top:1px solid var(--border);">
              <td style="padding:8px; color:var(--text-secondary);">${row.carrier}</td>
              ${routes.map(r => row[r] != null
                ? `<td style="text-align:center; padding:8px;"><span style="display:inline-block; padding:3px 10px; border-radius:6px; background:${heat(row[r])}; color:var(--text-primary); font-variant-numeric:tabular-nums;">${row[r]}h</span></td>`
                : `<td style="text-align:center; padding:8px; color:var(--text-muted);">—</td>`
              ).join("")}
            </tr>
          `).join("")}
        </tbody>
      </table></div>
    `;

    return `
      <div class="grid2">
        <div class="card">
          <h2>평균 지연시간</h2>
          <div class="desc">동일 항로 혼합 기준 (낮을수록 우수)</div>
          ${bars("avg_delay_hours", maxDelay, "var(--series-1)", "h")}
        </div>
        <div class="card">
          <h2>정시율 &amp; 중대지연률</h2>
          <div class="desc">정시율은 높을수록, 중대지연률은 낮을수록 우수</div>
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">정시율 (24h 유예 기준)</div>
          ${bars("on_time_pct", maxOnTime, "var(--series-2)", "%")}
          <div style="font-size:11px; color:var(--text-muted); margin:10px 0 4px;">중대지연률 (&gt;72h)</div>
          ${bars("major_delay_rate_pct", maxMajor, "var(--series-4)", "%")}
        </div>
      </div>
      <div class="card">
        <h2>선사 × 항로 평균 지연 (h)</h2>
        <div class="desc">색이 진할수록(붉은색) 해당 선사·항로 조합의 평균 지연이 큼</div>
        ${table}
        <div class="do-foot">최우수 ${cs[0].carrier}(${cs[0].avg_delay_hours}h) vs 최하위 ${cs[cs.length-1].carrier}(${cs[cs.length-1].avg_delay_hours}h) — 동일 항로에서도 운영방식 차이로 격차 발생, 벤치마킹 여지 있음.</div>
      </div>
      ${ebTable()}
    `;
  }
  function ebTable() {
    const eb = D.advanced.empirical_bayes;
    const v = eb.validation;
    const rows = eb.cells.slice().sort((a, b) => a.n - b.n);
    return `
      <div class="card">
        <h2>선사×항로 평균 지연 (원자료 vs 축소추정)</h2>
        <div class="desc">표본이 적은 조합(n이 작을수록)은 축소추정(Empirical Bayes)이 더 안정적 — 전체 평균(${eb.grand_mean}h) 쪽으로 끌어당겨 우연한 변동에 의한 과대·과소 추정을 줄임 (τ=${eb.tau})</div>
        <div class="table-wrap"><table style="width:100%; border-collapse:collapse; font-size:12px;">
          <thead><tr>
            <th style="text-align:left; padding:8px; color:var(--text-muted); font-weight:600;">항로</th>
            <th style="text-align:left; padding:8px; color:var(--text-muted); font-weight:600;">선사</th>
            <th style="text-align:right; padding:8px; color:var(--text-muted); font-weight:600;">n</th>
            <th style="text-align:right; padding:8px; color:var(--text-muted); font-weight:600;">원자료 평균</th>
            <th style="text-align:right; padding:8px; color:var(--text-muted); font-weight:600;">축소추정</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr style="border-top:1px solid var(--border); ${r.n < 200 ? "background:color-mix(in srgb, var(--warning) 6%, transparent);" : ""}">
                <td style="padding:8px; color:var(--text-secondary);">${ROUTE_KO[r.route] || r.route}</td>
                <td style="padding:8px; color:var(--text-secondary);">${r.carrier}</td>
                <td style="padding:8px; text-align:right; font-variant-numeric:tabular-nums; color:${r.n < 200 ? "var(--warning)" : "var(--text-muted)"};">${r.n}</td>
                <td style="padding:8px; text-align:right; font-variant-numeric:tabular-nums;">${r.raw_mean}</td>
                <td style="padding:8px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600;">${r.shrunk_mean}</td>
              </tr>
            `).join("")}
          </tbody>
        </table></div>
        <div class="do-foot">표본이 적은 조합(주황 행, n&lt;200)은 SLA 산정에 축소추정 사용 권장. n=${v.n_simulations} 반복 시뮬레이션 검증: 평균오차 ${v.raw_avg_error}h → ${v.shrunk_avg_error}h (${v.error_reduction_pct > 0 ? v.error_reduction_pct + "% 감소" : "개선 미미 — 선사간 차이가 노이즈가 아니라 실제 구조적 격차임을 시사"}).</div>
      </div>
    `;
  }

  function renderAll() {
    renderTabs();
    const panels = {
      overview: renderOverview, map: renderShipMap, model: renderModel, buffer: renderBuffer,
      spc: renderSPC, routecalc: renderRouteCalc, carrier: renderCarrier,
    };
    document.getElementById("panels").innerHTML = TABS.map(t =>
      `<div class="tab-panel" data-active="${t.key === active}">${panels[t.key]()}</div>`
    ).join("");
    wireBuffer();
    wireRouteCalc();
    wireSPC();
    wireVoyageSim();
  }

  // real visible-viewport height, since mobile browsers (esp. Samsung Internet /
  // Chrome on Galaxy devices) resolve 100vh against the layout viewport, not the
  // actually visible one behind the address bar -- --vh is the true per-pixel value,
  // used as a dvh fallback and reference for #simMapWrap max-height calcs above.
  function setVhVar() {
    document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
  }
  setVhVar();
  window.addEventListener("resize", () => {
    setVhVar();
    simRenderMap();
  });
  window.addEventListener("orientationchange", () => {
    // layout/safe-area insets settle after the rotate animation on Android, so
    // recompute once immediately and once more ~300ms later
    setVhVar();
    simRenderMap();
    setTimeout(() => { setVhVar(); simRenderMap(); }, 300);
  });

  renderAll();
})();
</script>
